<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naveen Resume</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{
            background:#050816;
            color:white;
            min-height:100vh;
        }

        .background{
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background:linear-gradient(
                -45deg,
                #050816,
                #0f172a,
                #001f3f,
                #0a0a0a
            );
            background-size:400% 400%;
            animation:bgMove 15s ease infinite;
            z-index:-1;
        }

        @keyframes bgMove{
            0%{background-position:0% 50%;}
            50%{background-position:100% 50%;}
            100%{background-position:0% 50%;}
        }

        .home-btn{
            position:fixed;
            top:20px;
            right:20px;
            width:60px;
            height:60px;
            border-radius:50%;
            background:#00d9ff;
            color:black;
            display:flex;
            justify-content:center;
            align-items:center;
            text-decoration:none;
            font-size:22px;
            font-weight:bold;
            transition:.4s;
        }

        .home-btn:hover{
            transform:scale(1.1);
            box-shadow:0 0 20px #00d9ff;
        }

        .container{
            width:50%;
            max-width:1200px;
            margin:auto;
            padding:100px 0 50px;
            text-align:center;
        }

        h1{
            color:#00d9ff;
            margin-bottom:30px;
        }

        .pdf-viewer{
            width:100%;
            height:800px;
            border:none;
            border-radius:20px;
            background:white;
        }

        .download-btn{
            display:inline-block;
            margin-bottom:25px;
            padding:15px 30px;
            background:#00d9ff;
            color:black;
            text-decoration:none;
            border-radius:12px;
            font-weight:600;
            transition:.4s;
        }

        .download-btn:hover{
            transform:translateY(-5px);
            box-shadow:0 0 20px #00d9ff;
        }

    </style>
</head>

<body>

    <div class="background"></div>

    <a href="index.html" class="home-btn">🏠</a>

    <div class="container">

        <h1>My Resume</h1>


        <iframe
            src="https://r0.image2url.com/uploads/119cf52e8ecc4d82_compressed_ecf1e9b8f88d3c4f.png"
            class="pdf-viewer">
        </iframe>

        <a href="Naveen_Resume.pdf" download class="download-btn">
            ⬇️Download Resume
        </a>

    </div>

</body>
</html>
